[plugin]

name="Latency & Upscaling"
description="Adds NVIDIA Reflex and DLSS Super Resolution / DLAA (Frame Generation later) to Godot 4.7 projects. The GDExtension works without enabling this plugin; the plugin adds status reports, Tools menu entries, the NVIDIA DLSS runtime download and its export."
author="M-Rocchinotti and contributors"
version="0.2.0"
script="latency_upscaling_plugin.gd"
