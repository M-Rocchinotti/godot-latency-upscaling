; Default settings of the NVIDIA DLSS addon.
;
; Every value here can be overridden per project in Project Settings > nvidia_dlss/...
; (those overrides are the only thing ever written to project.godot, and only when changed),
; and at run time through the NvidiaDLSS singleton. The addon's built-in defaults are the
; values below, so deleting this file changes nothing.

[general]

; false: the Vulkan hook is not installed at all (the addon does nothing).
enabled=true
; false: in the editor process Vulkan calls only pass through. Games started from the editor
; (F5) and exported games are separate processes and use the addon regardless.
enable_in_editor=false

[reflex]

; 0 = Off, 1 = On, 2 = On + Boost. NVIDIA recommends On as the default.
mode=1
; Frame-rate limit applied by the Reflex sleep, in frames per second. 0 = no limit,
; otherwise 10 to 1000. Prefer this over Engine.max_fps while Reflex is active.
fps_limit=0.0
; Send the TRIGGER_FLASH latency marker on left mouse clicks (for the Reflex Flash Indicator
; and latency analyzers; the driver decides whether anything is shown).
flash_indicator_marker=true

[overlay]

; Show the small latency overlay in games (toggle at run time: NvidiaDLSS.overlay_visible).
enabled=false
